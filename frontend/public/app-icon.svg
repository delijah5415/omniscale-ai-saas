  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <!-- Glowing Node Gradients -->
    <linearGradient id="indigoGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base (App Icon Shape) -->
  <rect x="32" y="32" width="960" height="960" rx="224" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="12" />
  <!-- Outer Orbit Ring -->
  <circle cx="512" cy="512" r="320" fill="none" stroke="#312e81" stroke-width="16" stroke-dasharray="24 16" opacity="0.6" />
  <!-- Scaling Nodes and Grid Connections -->
  <g filter="url(#neonShadow)">
    <!-- Connection Lines -->
    <path d="M 320 640 L 512 320 L 704 640 L 512 512 Z" fill="none" stroke="url(#indigoGlow)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 512 320 L 512 704" fill="none" stroke="url(#amberGlow)" stroke-width="16" stroke-dasharray="12 12" />
    <!-- Center Core Node -->
    <circle cx="512" cy="512" r="48" fill="url(#amberGlow)" />

    <!-- Top Scale Node -->
    <circle cx="512" cy="320" r="56" fill="url(#indigoGlow)" />
    <circle cx="512" cy="320" r="28" fill="#ffffff" />
    <!-- Bottom Left Node -->
    <circle cx="320" cy="640" r="48" fill="url(#indigoGlow)" />

    <!-- Bottom Right Node -->
    <circle cx="704" cy="640" r="48" fill="url(#indigoGlow)" />

    <!-- Floating AI Spark Nodes -->
    <circle cx="640" cy="380" r="16" fill="#fbbf24" />
    <circle cx="380" cy="440" r="12" fill="#818cf8" />
  </g>
</svg>
